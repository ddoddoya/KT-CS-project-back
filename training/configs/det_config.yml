Global:
  use_gpu: true
  epoch_num: 200
  log_smooth_window: 20
  print_batch_step: 10
  save_epoch_step: 5
  save_model_dir: /home/elicer/KT-CS-project-back/models/det_model/
  save_log_path: /home/elicer/KT-CS-project-back/training/logs/det_log/
  pretrained_model: /home/elicer/KT-CS-project-back/pretrain/det/ch_PP-OCRv3_det_distill_train/best_accuracy.pdparams
  character_dict_path: /home/elicer/KT-CS-project-back/dataset/labels/charset.txt
  max_text_length: 50

  eval_batch_step:
    - 0
    - 2000

Architecture:
  model_type: det
  algorithm: DB
  Transform: null

  Backbone:
    name: ResNet
    layers: 18

  Neck:
    name: DBFPN
    in_channels: [64, 128, 256, 512]
    out_channels: 256

  Head:
    name: DBHead
    k: 50

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5

Metric:
  name: DetMetric

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/elicer/KT-CS-project-back/dataset/images
    label_file_list:
      - /home/elicer/KT-CS-project-back/dataset/train_det.json
    transforms:
      - DecodeImage: {img_mode: RGB, channel_first: false}
      - MakeShrinkMap: {shrink_ratio: 0.4}
      - MakeBorderMap: {shrink_ratio: 0.4}
      - NormalizeImage: {scale: 1./255., mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      - ToCHWImage: {}
  loader:
    shuffle: true
    batch_size_per_card: 8
    drop_last: false
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/elicer/KT-CS-project-back/dataset/images
    label_file_list:
      - /home/elicer/KT-CS-project-back/dataset/val_det.json
    transforms:
      - DecodeImage: {img_mode: RGB, channel_first: false}
      - MakeShrinkMap: {shrink_ratio: 0.4}
      - MakeBorderMap: {shrink_ratio: 0.4}
      - NormalizeImage: {scale: 1./255., mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      - ToCHWImage: {}
  loader:
    shuffle: false
    batch_size_per_card: 4
    drop_last: false
    num_workers: 2

Optimizer:
  name: Adam
  lr:
    learning_rate: 0.001
  regularizer:
    name: L2
    factor: 0.0001

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3
